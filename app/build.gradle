plugins {
    id 'com.android.application'
}

// Local backup is ignored; CI supplies the same values through repository secrets.
def localSigning = new Properties()
def localSigningFile = rootProject.file('.local/signing/release.properties')
if (localSigningFile.isFile()) {
    localSigningFile.withReader('UTF-8') { localSigning.load(it) }
}
def signingValue = { name -> System.getenv(name) ?: localSigning.getProperty(name) }

android {
    namespace 'dev.dexdroid'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.dexdroid'
        minSdk 30
        targetSdk 36
        versionCode 33
        versionName '0.12.0'
        testInstrumentationRunner 'dev.dexdroid.DeviceChecks'
    }
    lint {
        baseline file('lint-baseline.xml')
        warningsAsErrors true
        abortOnError true
        textReport true
        htmlReport true
        xmlReport true
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def keyPath = signingValue('DEXDROID_KEYSTORE_PATH')
            if (keyPath) {
                storeFile rootProject.file(keyPath)
                storePassword signingValue('DEXDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('DEXDROID_KEY_ALIAS')
                keyPassword signingValue('DEXDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}

// Windows locale must not reinterpret UTF-8 UI labels or instrumentation checks.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
