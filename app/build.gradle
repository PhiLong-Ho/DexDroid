plugins { id 'com.android.application' }
android {
 namespace 'dev.dexdroid'
 compileSdk 35
 defaultConfig { applicationId 'dev.dexdroid'; minSdk 30; targetSdk 32; versionCode 5; versionName '0.5.1'; testInstrumentationRunner 'dev.dexdroid.DeviceChecks' }
 // Sideload-only Android 11 build; store target migration is separate work.
 lint { disable 'ExpiredTargetSdkVersion' }
 buildFeatures { aidl true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'dev.rikka.shizuku:api:13.1.5'
 implementation 'dev.rikka.shizuku:provider:13.1.5'
}
