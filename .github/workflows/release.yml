name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, matching app versionName and CHANGELOG
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      EVIDENCE_DIR: testresults/unreleased/runs/release-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and prepare version notes
        id: release
        run: |
          python tools/review_gate.py check --revision HEAD
          python tools/release.py prepare --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: Select versioned evidence folder
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: echo "EVIDENCE_DIR=testresults/$RELEASE_VERSION/runs/release-${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Quality gates
        run: |
          mkdir -p "$EVIDENCE_DIR/host"
          bash ./gradlew --no-daemon qualityCheck 2>&1 | tee "$EVIDENCE_DIR/host/quality.txt"
          python -m pip install -r tools/requirements-dev.txt
          {
            python tools/check_requirements.py
            python tools/coverage.py check
            python tools/check_documentation.py
            python -m ruff check tools
            python -m ruff format --check tools
            python tools/run_tool_tests.py --output "$EVIDENCE_DIR/host/tool-tests.json"
          } 2>&1 | tee "$EVIDENCE_DIR/host/tooling.txt"
      - name: Restore private release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEXDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('KEYSTORE_BASE64')
          if not encoded:
              raise SystemExit('Missing DEXDROID_KEYSTORE_BASE64 repository secret')
          key = Path(os.environ['RUNNER_TEMP']) / 'dexdroid-release.jks'
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'DEXDROID_KEYSTORE_PATH={key}\n')
          PY
      - name: Build signed APK and AAB
        env:
          DEXDROID_KEYSTORE_PASSWORD: ${{ secrets.DEXDROID_KEYSTORE_PASSWORD }}
          DEXDROID_KEY_ALIAS: ${{ secrets.DEXDROID_KEY_ALIAS }}
          DEXDROID_KEY_PASSWORD: ${{ secrets.DEXDROID_KEY_PASSWORD }}
        run: |
          for name in DEXDROID_KEYSTORE_PASSWORD DEXDROID_KEY_ALIAS DEXDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing signing secret: $name"; exit 1; fi
          done
          bash ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease 2>&1 | tee "$EVIDENCE_DIR/host/release-build.txt"
          python tools/release.py package 2>&1 | tee "$EVIDENCE_DIR/host/package-verification.txt"
      - name: Generate release coverage and pass-rate report
        run: |
          python tools/release_report.py --evidence "$EVIDENCE_DIR"
          cat artifacts/release/release-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing key
        if: always()
        run: |
          key="$RUNNER_TEMP/dexdroid-release.jks"
          if [ -f "$key" ]; then rm -- "$key"; fi
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$EVIDENCE_DIR/host"
          git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"
          if [ -d app/build/reports ]; then cp -R app/build/reports "$EVIDENCE_DIR/host/"; fi
          if [ -d app/build/test-results ]; then cp -R app/build/test-results "$EVIDENCE_DIR/host/"; fi
      - name: Check current public host evidence
        id: public_evidence
        if: always()
        run: python tools/check_privacy.py --evidence "$EVIDENCE_DIR"
      - name: Archive current release evidence
        run: python tools/release.py archive --evidence "$EVIDENCE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
      - name: Bundle current run Actions evidence
        id: bundle_evidence
        if: always() && steps.public_evidence.outcome == 'success'
        run: |
          python tools/evidence.py pack --source "$EVIDENCE_DIR" --output artifacts/release-run-evidence \
            --scope "Current release CI run; inspect raw outcomes. No device, visual or performance certification." \
            --workflow-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always() && steps.public_evidence.outcome == 'success' && steps.bundle_evidence.outcome == 'success'
        with:
          name: release-check-evidence
          path: artifacts/release-run-evidence/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts/release/
      - name: Publish verified assets and version summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python tools/review_gate.py check --revision HEAD
          python tools/release.py publish
