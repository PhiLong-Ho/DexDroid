name: Quality
on:
  push:
    # Version tags run the same gates in Release Android.
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE_DIR: testresults/unreleased/runs/ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require two candidate review approvals
        run: python tools/review_gate.py check --revision HEAD
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Host quality checks
        run: |
          mkdir -p "$EVIDENCE_DIR/host"
          bash ./gradlew --no-daemon qualityCheck 2>&1 | tee "$EVIDENCE_DIR/host/quality.txt"
      - run: python -m pip install -r tools/requirements-dev.txt
      - name: Documentation and tooling checks
        run: |
          {
            python tools/check_requirements.py
            python tools/coverage.py check
            python tools/check_documentation.py
            python -m ruff check tools
            python -m ruff format --check tools
            python tools/run_tool_tests.py --output "$EVIDENCE_DIR/host/tool-tests.json"
          } 2>&1 | tee "$EVIDENCE_DIR/host/tooling.txt"
      - name: Collect host reports
        if: always()
        run: |
          mkdir -p "$EVIDENCE_DIR/host"
          git rev-parse HEAD > "$EVIDENCE_DIR/source-commit.txt"
          if [ -d app/build/reports ]; then cp -R app/build/reports "$EVIDENCE_DIR/host/"; fi
          if [ -d app/build/test-results ]; then cp -R app/build/test-results "$EVIDENCE_DIR/host/"; fi
      - name: Check current public host evidence
        id: public_evidence
        if: always()
        run: python tools/check_privacy.py --evidence "$EVIDENCE_DIR"
      - uses: actions/upload-artifact@v4
        if: always() && steps.public_evidence.outcome == 'success'
        with:
          name: host-quality-evidence
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 14
