name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon qualityCheck
      - run: python tools/check_requirements.py
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python -m ruff check tools
      - run: python -m ruff format --check tools
      - run: python -m unittest discover -s tools/tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-quality-evidence
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
